name: ci
on:
  push: { branches: [main], tags: ["v*", "desktop-v*"] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test --workspace

  changes:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    permissions: { contents: read }
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.f.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            desktop:
              - 'desktop/**'
              - '.github/workflows/**'

  desktop:
    if: always() && (needs.changes.outputs.desktop == 'true' || startsWith(github.ref, 'refs/tags/desktop-v'))
    needs: [changes]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: desktop/src-tauri }
      - run: cargo fmt --check --all
        working-directory: desktop/src-tauri
      - run: cargo clippy -- -D warnings
        working-directory: desktop/src-tauri
      - run: cargo test
        working-directory: desktop/src-tauri

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-unknown-linux-musl }
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --target x86_64-unknown-linux-musl
      - run: cp target/x86_64-unknown-linux-musl/release/vaulti-server vaulti-server-linux-musl
      - uses: softprops/action-gh-release@v2
        with: { files: vaulti-server-linux-musl }

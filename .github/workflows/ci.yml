name: ci
on:
  push: { branches: [main], tags: ["v*", "desktop-v*"] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test --workspace

  changes:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    permissions: { contents: read }
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.f.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            desktop:
              - 'desktop/**'
              - '.github/workflows/**'

  desktop:
    if: always() && (needs.changes.outputs.desktop == 'true' || startsWith(github.ref, 'refs/tags/desktop-v'))
    needs: [changes]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: desktop/src-tauri }
      - run: cargo fmt --check --all
        working-directory: desktop/src-tauri
      - run: cargo clippy -- -D warnings
        working-directory: desktop/src-tauri
      - run: cargo test
        working-directory: desktop/src-tauri

  release-desktop:
    if: always() && needs.desktop.result == 'success' && startsWith(github.ref, 'refs/tags/desktop-v')
    needs: [desktop]
    runs-on: windows-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: desktop/src-tauri }
      - name: install tauri-cli (precompilata, pin + sha256)
        shell: pwsh
        run: |
          $ver = 'tauri-cli-v2.12.4'
          $hash = '3e8687fb184bd7f10ebd8642f7715f79f4a605c0694c142a21507e8a24dc0f8b'
          curl.exe -sSL -o cli.zip "https://github.com/tauri-apps/tauri/releases/download/$ver/cargo-tauri-x86_64-pc-windows-msvc.zip"
          if ((Get-FileHash cli.zip -Algorithm SHA256).Hash.ToLower() -ne $hash) { throw 'tauri-cli hash mismatch' }
          Expand-Archive cli.zip -DestinationPath cli-bin -Force
          Add-Content $env:GITHUB_PATH "$((Resolve-Path .).Path)\cli-bin"
      - name: riscrivi versione dal tag
        shell: pwsh
        run: |
          $v = $env:GITHUB_REF_NAME -replace '^desktop-v',''
          $p = 'desktop/src-tauri/tauri.conf.json'
          $t = (Get-Content $p -Raw).Replace('"version": "0.1.0"', ('"version": ' + '"' + $v + '"'))
          if ($t -notlike ('*"version": "' + $v + '"*')) { throw "versione non riscritta in $p: sorgente 0.1.0 non trovata" }
          $t | Set-Content $p -NoNewline
      - run: cargo tauri build --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        working-directory: desktop/src-tauri
      - name: rename asset
        shell: pwsh
        run: |
          $exe = Get-ChildItem 'desktop/src-tauri/target/release/bundle/nsis' -Filter '*-setup.exe' | Select-Object -First 1
          Move-Item $exe.FullName vaulti-setup-x64.exe
      - name: genera latest.json (manifest updater)
        shell: pwsh
        run: |
          $sig = Get-ChildItem 'desktop/src-tauri/target/release/bundle/nsis' -Filter '*.exe.sig' | Select-Object -First 1
          $s = (Get-Content $sig.FullName -Raw).Trim()
          $v = $env:GITHUB_REF_NAME -replace '^desktop-v',''
          @{ version = $v
             pub_date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
             platforms = @{ 'windows-x86_64' = @{ signature = $s; url = "https://github.com/FenixsGame/vaulti/releases/download/$env:GITHUB_REF_NAME/vaulti-setup-x64.exe" } }
             } | ConvertTo-Json -Depth 4 | Set-Content latest.json -NoNewline
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            vaulti-setup-x64.exe
            latest.json

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, ui]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-unknown-linux-musl }
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --target x86_64-unknown-linux-musl
      - run: cp target/x86_64-unknown-linux-musl/release/vaulti-server vaulti-server-linux-musl
      - uses: softprops/action-gh-release@v2
        with: { files: vaulti-server-linux-musl }

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --test web/js/*.test.mjs
